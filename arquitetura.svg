<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do jardim do Estêvão</title><desc id="desc">O navegador usa o Google para identificar a conta e envia o token ao servidor Next.js. As APIs de cadastro, estoque, personagem e cadeira consultam o Postgres no Neon.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#517761"/></marker></defs>
<style>text{font:16px system-ui,sans-serif;fill:#263b30}.title{font-size:29px;font-weight:650}.head{font-weight:650;font-size:20px}.small{font-size:14px}.box{fill:#fffdf8;stroke:#afbfad;stroke-width:1.5}.link{fill:none;stroke:#517761;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="530" rx="20" fill="#f6f5ef"/><text x="36" y="52" class="title">Arquitetura do jardim do Estêvão</text>
<rect x="36" y="100" width="248" height="370" rx="12" class="box"/><text x="56" y="138" class="head">Navegador</text><text x="56" y="179">Convite e formulário</text><text x="56" y="204">Personagem e jardim</text><text x="56" y="229">Painel da família</text><path d="M56 258h204" stroke="#d0d8ca"/><text x="56" y="292">Sessão Google</text><text x="56" y="319" class="small">Cookie HttpOnly</text><text x="56" y="342" class="small">Perfil salvo no servidor</text><text x="56" y="410">Botão Google</text><text x="56" y="437" class="small">Identificação opcional</text>
<rect x="378" y="100" width="276" height="251" rx="12" class="box"/><text x="398" y="138" class="head">Next.js na Vercel</text><text x="398" y="176">Verifica a identidade Google</text><text x="398" y="207">Consulta o estoque</text><text x="398" y="238">Registra presenças e vínculos</text><text x="398" y="269">Salva personagem e cadeira</text><text x="398" y="300">Valida acesso da família</text>
<rect x="747" y="145" width="179" height="148" rx="12" class="box"/><text x="766" y="181" class="head">Neon</text><text x="766" y="211">Postgres</text><text x="766" y="245" class="small">Participações, vínculos,</text><text x="766" y="266" class="small">reservas e cadeiras</text>
<rect x="378" y="385" width="276" height="85" rx="12" class="box"/><text x="398" y="419" class="head">Google Identity</text><text x="398" y="448" class="small">Escolha da conta e token assinado</text>
<path class="link" d="M284 212h90"/><text x="298" y="198" class="small">HTTPS</text><path class="link" d="M654 212h88"/><text x="679" y="198" class="small">SQL</text><path class="link" d="M284 423h90"/><path class="link" d="M528 384v-29"/><text x="36" y="505" class="small">Na demonstração, o navegador mantém os dados de teste localmente.</text></svg>
